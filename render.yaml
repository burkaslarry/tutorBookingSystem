# Optional Render Postgres deploy only. Production on Hostinger uses DB_TYPE=mysql — do not use this Blueprint for Hostinger.

services:
  - type: web
    name: tutorbookingsystem
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: "true"
      - key: PGSSLMODE
        value: require

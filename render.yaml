# Render Blueprint — tutor booking (Postgres). Sync in Dashboard after push.
# Existing Postgres (e.g. StorySeed / johnny_ai_tutor_* tables): set DATABASE_URL manually; do not add a second DB here unless you want a new one.

services:
  - type: web
    name: tutorbookingsystem
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: "true"
      - key: PGSSLMODE
        value: require
